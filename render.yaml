services:
  - type: web
    name: online-marriage-registration-system
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DB_SERVER
        value: mysql-xxxx.aivencloud.com
      - key: DB_PORT
        value: "26284"
      - key: DB_USERNAME
        value: avnadmin
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: defaultdb
      - key: DB_SSL
        value: "true"
      - key: BASE_URL
        sync: false

